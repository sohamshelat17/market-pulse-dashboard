# Render Blueprint — lets Render auto-configure this service when you pick
# "New +" > "Blueprint" and point it at this repo. Manual "Web Service"
# setup works too; see README.md for those exact settings.
services:
  - type: web
    name: market-pulse-dashboard
    runtime: python
    plan: free
    # The playwright install is best-effort: if Render's free tier can't
    # fit the Chromium download, the app still works fine — the Invesco
    # (QQQ/RSP) constituents heatmap just degrades to a top-20 fallback.
    buildCommand: "pip install -r requirements.txt && (playwright install --with-deps chromium || true)"
    startCommand: "python server.py"
